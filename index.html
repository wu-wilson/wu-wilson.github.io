<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FBFAF6" />
    <meta name="description" content="My personal website, showcasing my portfolio projects, resume, and socials." />
    <meta property="og:title" content="Wilson Wu" />
    <meta property="og:description" content="My personal website, showcasing my portfolio projects, resume, and socials." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Gloria Hallelujah, the site's only font. Requested here rather than via an `@import` in
         index.css so it downloads in parallel with the stylesheet instead of after it — the
         engine measures the caption band behind `document.fonts.ready`. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Gloria+Hallelujah&display=swap"
    />
    <title>Wilson Wu</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
